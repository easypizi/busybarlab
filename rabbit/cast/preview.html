<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cast frames</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 12px/1.3 sans-serif; }
    p { margin: 8px; }
    button { margin-right: 8px; }
    table { border-collapse: collapse; }
    td { padding: 6px; vertical-align: top; }
    canvas { width: 192px; height: 192px; background: #111; image-rendering: pixelated; display: block; }
    .bubble { width: 186px; height: 48px; overflow: auto; border: 3px solid #FE5000; color: #f3f3f3; background: #1a120c; font-size: 13px; }
    .think { color: #FE5000; text-align: center; }
    .user { color: #9a9188; }
    body.zoom canvas { width: 384px; height: 384px; }
    body.zoom .bubble { width: 378px; }
  </style>
</head>
<body>
  <p>
    <button id="play" type="button">play</button>
    <button id="step" type="button">step</button>
    <span id="readout"></span>
  </p>
  <table id="grid"></table>
  <script src="../assistant/cast.js"></script>
  <script src="stage.js"></script>
  <script>
    var params = new URLSearchParams(location.search);
    var frozen = params.has("freeze");
    var time = 0;
    var origin = performance.now();
    if (params.get("zoom")) document.body.classList.add("zoom");

    function clock() {
      if (frozen) return time;
      return time + (performance.now() - origin);
    }

    var labels = ["idle", "listen", "think", "speak", "action", "blink"];
    var people = ["tito", "paco", "carlos"];
    var table = document.getElementById("grid");
    var head = document.createElement("tr");
    head.appendChild(document.createElement("td"));
    labels.forEach(function (label) {
      var cell = document.createElement("td");
      cell.textContent = label;
      head.appendChild(cell);
    });
    table.appendChild(head);

    people.forEach(function (who) {
      var row = document.createElement("tr");
      var name = document.createElement("td");
      name.textContent = who;
      row.appendChild(name);
      labels.forEach(function (label) {
        var cell = document.createElement("td");
        var canvas = document.createElement("canvas");
        canvas.width = 192;
        canvas.height = 192;
        var bubble = document.createElement("div");
        bubble.className = "bubble";
        cell.appendChild(canvas);
        cell.appendChild(bubble);
        row.appendChild(cell);
        var stage = window.createStage(canvas, bubble, who, { clock: clock });
        if (label === "listen") stage.setMode("listen");
        if (label === "think") stage.setMode("think");
        if (label === "speak") stage.speak(who === "tito" ? "Hola, amigo." : "Ya está, listo.");
        if (label === "action") stage.speak("Listo.", who === "tito" ? "task" : who === "paco" ? "saved" : "logged");
        if (label === "blink") stage.lockBlink("eyes_shut");
      });
      table.appendChild(row);
    });

    if (frozen) time = Number(params.get("freeze")) || 0;

    document.getElementById("step").addEventListener("click", function () {
      if (!frozen) {
        time = clock();
        frozen = true;
      }
      time += 1000 / 12;
    });
    document.getElementById("play").addEventListener("click", function () {
      if (frozen) {
        origin = performance.now();
        frozen = false;
      } else {
        time = clock();
        frozen = true;
      }
    });
    setInterval(function () {
      document.getElementById("readout").textContent = Math.round(clock()) + " ms" + (frozen ? " frozen" : "");
    }, 100);
  </script>
</body>
</html>
