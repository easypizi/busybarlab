<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Install toy_lair on r1</title>
  <style>
    body { font: 16px/1.4 sans-serif; max-width: 420px; margin: 40px auto; }
    img { width: 220px; height: 220px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>Install toy_lair</h1>
  <p>Scan this QR with the r1 Creations camera.</p>
  <p><img id="qr" alt="QR code"></p>
  <p>Creation URL: <code id="url"></code></p>
  <script>
    var params = new URLSearchParams(location.search);
    var target = params.get("url") || (location.origin + "/creation/");
    document.getElementById("url").textContent = target;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
      encodeURIComponent(target);
  </script>
</body>
</html>
