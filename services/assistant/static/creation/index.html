<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, height=282, initial-scale=1, user-scalable=no">
  <title>Tito</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <header>
      <h1><img src="icon.png" alt="" width="20" height="20"> Tito</h1>
      <p id="status">hold PTT</p>
      <p id="count"></p>
      <p id="pair"></p>
    </header>
    <div id="rec" aria-hidden="true"></div>
    <p id="reply">hold PTT and talk</p>
    <div id="tap-gate" hidden>tap once for mic</div>
    <section id="peek" hidden>
      <ol id="list"></ol>
    </section>
    <p id="event-log"></p>
    <p id="hint">hold PTT or circle · wheel today</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
