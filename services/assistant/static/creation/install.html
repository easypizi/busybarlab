<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Install toy_lair on r1</title>
  <style>
    body { font: 16px/1.4 sans-serif; max-width: 420px; margin: 40px auto; }
    #qr svg { width: 220px; height: 220px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <h1>Install toy_lair</h1>
  <p>Scan this QR with the r1 Creations camera.</p>
  <p id="qr"></p>
  <p>Creation URL: <code id="url"></code></p>
  <p id="error"></p>
  <script>
    var params = new URLSearchParams(location.search);
    var token = params.get("token") || "";
    var target = location.origin + "/creation/?token=" + encodeURIComponent(token);
    document.getElementById("url").textContent = target;
    if (!token) {
      document.getElementById("error").textContent = "missing token";
    } else {
      fetch("/api/install-qr.svg", {
        headers: { "X-Assistant-Token": token }
      }).then(function (res) {
        if (!res.ok) throw new Error("qr " + res.status);
        return res.text();
      }).then(function (svg) {
        document.getElementById("qr").innerHTML = svg;
      }).catch(function (err) {
        document.getElementById("error").textContent = String(err.message || err);
      });
    }
  </script>
</body>
</html>
