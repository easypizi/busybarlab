# GitHub Pages for rabbit/assistant. After the repo rename the public URL is
# https://easypizi.github.io/toy_lair/ if Pages stays enabled.
name: pages

on:
  push:
    branches: [main]
    paths:
      - rabbit/assistant/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rabbit/assistant
      - id: deployment
        uses: actions/deploy-pages@v4
